// ============ 🏠 概览仪表盘 ============
function updateDashboardSummary() {
  const items = getTodayLogItems();
  let earned = 0, spent = 0;
  items.forEach(item => {
    if (!item.isBlocked) {
      if (item.delta > 0) earned += item.delta;
      else spent += Math.abs(item.delta);
    }
  });
  const net = earned - spent;
  document.getElementById("sumEarned").textContent = "+" + earned;
  document.getElementById("sumSpent").textContent = "−" + spent;
  const netEl = document.getElementById("sumNet");
  netEl.textContent = (net >= 0 ? "+" : "") + net;
  netEl.className = "s-val " + (net >= 0 ? "net-pos" : "net-neg");
  document.getElementById("sumBalance").textContent = totalPoints;
}

function getTodayLogItems() {
  const today = getTodayStr();
  const items = [];
  logList.querySelectorAll("li[data-date]").forEach(li => {
    if (li.dataset.date !== today) return;
    const label = li.dataset.label || "";
    const delta = parseInt(li.dataset.delta, 10) || 0;
    const time  = (li.querySelector(".time") || {}).textContent || "";
    items.push({ label: label, delta: delta, time: time, isBlocked: li.classList.contains("blocked-log") });
  });
  return items;
}

// ============ 🧾 发票 & 🖨️ 打印机动画 ============
function buildReceiptData(items) {
  let totalEarned = 0, totalSpent = 0;
  items.forEach(item => {
    if (!item.isBlocked) {
      if (item.delta > 0) totalEarned += item.delta;
      else totalSpent += Math.abs(item.delta);
    }
  });
  const netChange = totalEarned - totalSpent;
  const quote = RECEIPT_QUOTES[Math.floor(Math.random() * RECEIPT_QUOTES.length)];
  return {
    id: "r_" + Date.now(),
    date: getTodayStr(), time: getNowTimeStr(), dateChinese: getNowChinese(),
    items: items,
    summary: { totalEarned, totalSpent, netChange, finalBalance: totalPoints },
    quote: quote,
  };
}

function renderReceiptHTML(data, isArchived) {
  let itemsHTML = "";
  if (data.items.length === 0) {
    itemsHTML = '<div class="receipt-empty">📭 今日暂无流水记录</div>';
  } else {
    data.items.forEach(item => {
      const ptsClass = item.delta > 0 ? "earn" : "spend";
      const sign = item.delta > 0 ? "+" : "";
      itemsHTML += `
        <div class="receipt-item">
          <span class="item-label">${escapeHtml(item.label)}</span>
          <span class="item-dots">· · · · · · · · · · ·</span>
          <span class="item-pts ${ptsClass}">${sign}${item.delta} 分</span>
        </div>`;
    });
  }
  const s = data.summary;
  const netSign = s.netChange > 0 ? "+" : "";
  const netClass = s.netChange >= 0 ? "earn" : "spend";
  return `
    <div class="receipt-header">
      ${isArchived ? '<span class="archive-badge">📦 已存档</span>' : ''}
      <div class="receipt-stars">* * * * * * * * * * * *</div>
      <div class="receipt-title">个人积分每日结算发票</div>
      <div class="receipt-stars">* * * * * * * * * * * *</div>
      <div class="receipt-date">${data.dateChinese}</div>
      ${isArchived ? '' : '<div class="receipt-no">NO. ' + data.id.substring(2, 12) + '</div>'}
    </div>
    <div class="receipt-divider">— — — — — — — — — — — —</div>
    <div class="receipt-items">${itemsHTML}</div>
    <div class="receipt-divider">— — — — — — — — — — — —</div>
    <div class="receipt-summary">
      <div class="sum-row"><span class="sum-label">📈 今日获取总积分</span><span class="sum-val earn">+${s.totalEarned}</span></div>
      <div class="sum-row"><span class="sum-label">📉 今日扣除 / 消费</span><span class="sum-val spend">−${s.totalSpent}</span></div>
      <div class="sum-row"><span class="sum-label">📊 今日净变动</span><span class="sum-val ${netClass}">${netSign}${s.netChange}</span></div>
      <div class="sum-row" style="margin-top:8px;padding-top:8px;border-top:1px dashed #D5CFC0;">
        <span class="sum-label">💰 期末总积分余额</span><span class="sum-val balance">${s.finalBalance} 分</span>
      </div>
    </div>
    <div class="receipt-divider">— — — — — — — — — — — —</div>
    <div class="receipt-footer"><span class="quote-icon">💌</span><p>${escapeHtml(data.quote)}</p></div>
    <div class="tear-guide" id="tearGuide">✂︎  捏住向下撕开，存入档案  ✂︎</div>`;
}

function showReceipt() {
  const items = getTodayLogItems();
  if (items.length === 0) {
    showToast("📭 今日暂无流水记录", "warn");
    return;
  }
  const data = buildReceiptData(items);
  receiptPaper.innerHTML = renderReceiptHTML(data, false);
  receiptPaper._receiptData = data;
  receiptPaper.classList.remove("torn", "fly-to-archive", "tearable", "tearing");
  receiptActions.style.display = "flex";

  receiptOverlay.classList.add("show");
  printerBar.classList.add("active");
  printerStatus.classList.add("show");

  let tickCount = 0;
  const tickInterval = setInterval(() => {
    playSound("tick");
    tickCount++;
    printerStatus.textContent = "打印中" + "·".repeat((tickCount % 3) + 1);
    if (tickCount >= 12) {
      clearInterval(tickInterval);
      printerStatus.textContent = "打印完成 ✓";
      setTimeout(() => { printerStatus.classList.remove("show"); printerBar.classList.remove("active"); }, 600);
    }
  }, 100);

  receiptPaper.classList.add("feeding");
  receiptPaper.addEventListener("animationend", function onFeedEnd() {
    receiptPaper.removeEventListener("animationend", onFeedEnd);
    receiptPaper.classList.remove("feeding");
    receiptPaper.style.clipPath = "";
    enableTearOff();
  }, { once: true });
}

function enableTearOff() {
  receiptPaper.classList.add("tearable");
  const guide = document.getElementById("tearGuide");
  if (!guide) return;

  const onStart = (e) => {
    e.preventDefault();
    isTearing = true; tearStartY = e.touches ? e.touches[0].clientY : e.clientY; tearOffset = 0;
    receiptPaper.classList.add("tearing");
    receiptPaper.style.transition = "none";
  };
  const onMove = (e) => {
    if (!isTearing) return;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    tearOffset = clientY - tearStartY;
    if (tearOffset < 0) tearOffset = 0;
    receiptPaper.style.transform = `translateY(${tearOffset}px) rotate(${tearOffset * 0.02}deg)`;
    if (tearOffset > 50) { guide.textContent = "✂︎  松手！撕下小票  ✂︎"; guide.style.color = "#C85B38"; }
    else { guide.textContent = "✂︎  捏住向下撕开，存入档案  ✂︎"; guide.style.color = "#B5A890"; }
  };
  const onEnd = () => {
    if (!isTearing) return;
    isTearing = false;
    receiptPaper.classList.remove("tearing");
    receiptPaper.style.transition = "transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)";
    if (tearOffset > 60) {
      playSound("tear");
      receiptPaper.classList.add("torn");
      receiptPaper.classList.remove("tearable");
      receiptActions.style.display = "none";
      receiptPaper.addEventListener("animationend", function onTearEnd() {
        receiptPaper.removeEventListener("animationend", onTearEnd);
        autoArchiveFromTear(receiptPaper._receiptData);
        closeReceipt();
        receiptPaper.classList.remove("torn");
        receiptPaper.style.transform = "";
      }, { once: true });
    } else {
      receiptPaper.style.transform = "";
      guide.textContent = "✂︎  捏住向下撕开，存入档案  ✂︎";
      guide.style.color = "#B5A890";
    }
  };

  receiptPaper.addEventListener("mousedown", onStart);
  receiptPaper.addEventListener("touchstart", onStart, { passive: false });
  window.addEventListener("mousemove", onMove);
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("mouseup", onEnd);
  window.addEventListener("touchend", onEnd);

  receiptPaper._cleanupTear = () => {
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("touchmove", onMove);
    window.removeEventListener("mouseup", onEnd);
    window.removeEventListener("touchend", onEnd);
    receiptPaper.removeEventListener("mousedown", onStart);
    receiptPaper.removeEventListener("touchstart", onStart);
  };
}

function autoArchiveFromTear(data) {
  if (!data || !data.items || data.items.length === 0) return;
  receipts.unshift(data);
  saveReceipts();
  renderHistoryList();
  const today = getTodayStr();
  logList.querySelectorAll("li[data-date]").forEach(li => { if (li.dataset.date === today) li.remove(); });
  if (logList.children.length === 0) { logList.innerHTML = '<li class="empty">暂无记录，快去完成第一个任务吧 ✨</li>'; }
  // 重置熔断计数器
  dailyDeducted = 0;
  saveDailyData();
  updateDailyBar();
  savePoints();
  updateDashboardSummary();
  refreshSpendButtons();

  const historyRect = historyCard.getBoundingClientRect();
  const paperRect = receiptPaper.getBoundingClientRect();
  const flyX = historyRect.left + historyRect.width / 2 - (paperRect.left + paperRect.width / 2);
  const flyY = historyRect.top + 40 - paperRect.top;
  receiptPaper.style.setProperty("--fly-x", flyX + "px");
  receiptPaper.style.setProperty("--fly-y", flyY + "px");
  receiptPaper.classList.add("fly-to-archive");

  historyCard.classList.add("receiving");
  if (!historyCard.classList.contains("open")) { historyCard.classList.add("open"); }
  setTimeout(() => { historyCard.classList.remove("receiving"); receiptPaper.classList.remove("fly-to-archive"); }, 900);
  showToast("🧾 小票已撕下并存入档案盒！今日圆满结束 ✨", "ok");
}

function closeReceipt() {
  if (receiptPaper._cleanupTear) { receiptPaper._cleanupTear(); receiptPaper._cleanupTear = null; }
  isTearing = false;
  receiptPaper.classList.remove("tearable", "tearing", "feeding", "torn", "fly-to-archive");
  receiptPaper.style.transform = ""; receiptPaper.style.clipPath = "";
  receiptOverlay.classList.remove("show");
  printerBar.classList.remove("active");
  printerStatus.classList.remove("show");
}

function downloadReceipt() { downloadReceiptFromPaper(receiptPaper, "今日结算小票"); }

// ============ 💾 存档 ============
function archiveTodayAndClear() {
  const items = getTodayLogItems();
  if (items.length === 0) { showToast("📭 今日暂无流水记录，无需存档", "warn"); return; }
  const data = buildReceiptData(items);
  receipts.unshift(data);
  saveReceipts();
  renderHistoryList();
  const today = getTodayStr();
  logList.querySelectorAll("li[data-date]").forEach(li => { if (li.dataset.date === today) li.remove(); });
  if (logList.children.length === 0) { logList.innerHTML = '<li class="empty">暂无记录，快去完成第一个任务吧 ✨</li>'; }
  // 重置熔断计数器
  dailyDeducted = 0;
  saveDailyData();
  updateDailyBar();
  savePoints();
  updateDashboardSummary();
  refreshSpendButtons();
  showToast("💾 今日流水已存档！共 " + items.length + " 条记录", "ok");
  if (receiptOverlay.classList.contains("show")) { closeReceipt(); }
  if (!historyCard.classList.contains("open")) { historyCard.classList.add("open"); }
}

// ============ 🎁 兑换商品本地 CRUD ============
function toggleExchangeForm() {
  exchangeFormOpen = !exchangeFormOpen;
  document.getElementById("exchangeFormWrap").classList.toggle("open", exchangeFormOpen);
  document.getElementById("btnNewExchange").textContent = exchangeFormOpen ? "− 收起表单" : "＋ 添加兑换商品";
  if (!exchangeFormOpen && editingExchangeId) cancelExchangeEdit();
  if (exchangeFormOpen && !editingExchangeId) {
    document.getElementById("exchangeName").value = "";
    document.getElementById("exchangeCost").value = "10";
    document.getElementById("exchangeEmoji").value = "";
    document.getElementById("exchangeName").focus();
  }
}

function submitExchangeItem() {
  const nameInput = document.getElementById("exchangeName");
  const costInput = document.getElementById("exchangeCost");
  const emojiInput = document.getElementById("exchangeEmoji");
  const name = nameInput.value.trim();
  const cost = parseInt(costInput.value, 10) || 0;
  const emoji = emojiInput.value.trim() || "🎁";

  if (!name) { showToast("请输入商品名称", "err"); return; }
  if (cost <= 0 || cost > 999) { showToast("积分需在 1~999 之间", "err"); return; }

  if (editingExchangeId) {
    // 编辑模式
    // 检查是否是预设兑换
    const presetTask = PRESET_TASKS.find(p => p.id === editingExchangeId && p.type === 'exchange');
    if (presetTask) {
      // 预设转为自定义
      if (!deletedPresets.includes(presetTask.id)) deletedPresets.push(presetTask.id);
      saveDeletedPresets();
      updateRestoreButton();
      const newTask = {
        id: "custom_" + Date.now(),
        name: name,
        pts: cost,
        type: "exchange",
        categoryId: "cat_all",
      };
      customTasks.push(newTask);
      saveCustomTasks();
      // 同步收藏数据
      const bm = bookmarkedExchange.find(b => b.id === editingExchangeId);
      if (bm) { bm.id = newTask.id; bm.name = name; bm.cost = cost; bm.emoji = emoji; saveBookmarks(); }
      showToast("✅ 兑换商品已更新（已转为自定义）", "ok");
    } else {
      // 自定义兑换：直接更新
      const task = customTasks.find(t => t.id === editingExchangeId);
      if (task) {
        task.name = name; task.pts = cost; task.type = "exchange";
        saveCustomTasks();
        // 同步收藏数据
        const bm = bookmarkedExchange.find(b => b.id === editingExchangeId);
        if (bm) { bm.name = name; bm.cost = cost; bm.emoji = emoji; saveBookmarks(); }
        showToast("✅ 兑换商品已更新：" + name, "ok");
      }
    }
    cancelExchangeEdit();
  } else {
    // 新建模式
    const task = {
      id: "custom_" + Date.now(),
      name: name,
      pts: cost,
      type: "exchange",
      categoryId: "cat_all",
    };
    customTasks.push(task);
    saveCustomTasks();
    showToast("✅ 已添加兑换商品：" + name, "ok");
  }

  renderAllExchangeItems();
  renderGoalList();
  refreshExchangeButtons();
  updateDashboardSummary();
  // 清空表单
  nameInput.value = ""; costInput.value = "10"; emojiInput.value = "";
  document.getElementById("exchangeName").focus();
}

function startEditExchange(id) {
  editingExchangeId = id;
  // 展开表单
  if (!exchangeFormOpen) { exchangeFormOpen = true; document.getElementById("exchangeFormWrap").classList.add("open"); document.getElementById("btnNewExchange").textContent = "− 收起表单"; }

  // 查找兑换项数据
  const presetTask = PRESET_TASKS.find(p => p.id === id && p.type === 'exchange');
  const customTask = customTasks.find(t => t.id === id && t.type === 'exchange');
  const item = presetTask || customTask;
  if (!item) return;

  document.getElementById("exchangeName").value = item.name;
  document.getElementById("exchangeCost").value = presetTask ? presetTask.cost : Math.abs(item.pts);
  // 预设用自带的 emoji，自定义先留空
  document.getElementById("exchangeEmoji").value = presetTask ? (presetTask.emoji || "") : "";

  document.getElementById("btnSubmitExchange").textContent = "✎ 更新";
  document.getElementById("btnCancelExchange").style.display = "";
  document.getElementById("exchangeName").focus();
}

function cancelExchangeEdit() {
  editingExchangeId = null;
  document.getElementById("exchangeName").value = "";
  document.getElementById("exchangeCost").value = "10";
  document.getElementById("exchangeEmoji").value = "";
  document.getElementById("btnSubmitExchange").textContent = "＋ 添加";
  document.getElementById("btnCancelExchange").style.display = "none";
}

// ============ ⭐ 收藏联动 ============
function loadBookmarks() {
  try { const raw = localStorage.getItem("my_points_bookmarked_exchange"); if (raw) bookmarkedExchange = JSON.parse(raw); } catch(e) { bookmarkedExchange = []; }
}
function saveBookmarks() {
  try { localStorage.setItem("my_points_bookmarked_exchange", JSON.stringify(bookmarkedExchange)); } catch(e) {}
  scheduleCloudSave();
}
function toggleBookmark(id, name, emoji, cost) {
  const idx = bookmarkedExchange.findIndex(b => b.id === id);
  if (idx >= 0) {
    const removed = bookmarkedExchange[idx];
    bookmarkedExchange.splice(idx, 1);
    showToast("已取消收藏：" + removed.name);
  } else if (name) {
    bookmarkedExchange.push({ id, name, emoji: emoji || '📌', cost: cost || 0 });
    showToast("⭐ 已收藏：" + name + "  → 进度条已加入愿望清单");
  }
  saveBookmarks();
  renderAllExchangeItems();
  renderGoalList();
}
function isBookmarked(id) {
  return bookmarkedExchange.some(b => b.id === id);
}

// ============ 📜 历史发票存档 ============
function loadReceipts() {
  try { const raw = localStorage.getItem("my_points_receipts"); if (raw) receipts = JSON.parse(raw); } catch (e) { receipts = []; }
}
function saveReceipts() {
  try { localStorage.setItem("my_points_receipts", JSON.stringify(receipts)); } catch (e) {}
  scheduleCloudSave();
}
function toggleHistory() { historyCard.classList.toggle("open"); }
function renderHistoryList() {
  historyList.innerHTML = "";
  if (receipts.length === 0) {
    historyList.innerHTML = '<div class="hi-empty">暂无存档发票，点击「💾 存档并清空今日流水」开始存档吧 ✨</div>';
    return;
  }
  receipts.forEach(r => {
    const s = r.summary;
    const netSign = s.netChange >= 0 ? "+" : "";
    const netClass = s.netChange >= 0 ? "positive" : "negative";
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `
      <div style="flex:1;min-width:0;" onclick="viewHistoryReceipt('${r.id}')">
        <div class="hi-date">🧾 ${r.date}  (${r.time})</div>
        <div class="hi-summary">
          <span style="color:#6B8F71;">+${s.totalEarned}</span>
          <span style="color:#C85B38;">−${s.totalSpent}</span>
          <span style="color:#8A9B92;">余额 ${s.finalBalance}</span>
        </div>
      </div>
      <span class="hi-net ${netClass}" onclick="viewHistoryReceipt('${r.id}')" style="cursor:pointer;margin-right:8px;">${netSign}${s.netChange}</span>
      <button class="hi-delete" title="删除此存档" onclick="deleteHistoryReceipt('${r.id}', event)">🗑</button>
    `;
    historyList.appendChild(div);
  });
}
function viewHistoryReceipt(id) {
  const r = receipts.find(r => r.id === id);
  if (!r) return;
  currentViewingReceiptId = id;
  historyReceiptPaper.innerHTML = renderReceiptHTML(r, true);
  historyReceiptPaper._receiptData = r;
  historyReceiptOverlay.classList.add("show");
}
function closeHistoryReceipt() { historyReceiptOverlay.classList.remove("show"); currentViewingReceiptId = null; }
function downloadHistoryReceipt() {
  downloadReceiptFromPaper(historyReceiptPaper, "结算小票_" + (historyReceiptPaper._receiptData?.date || "archive"));
}
function deleteHistoryReceipt(id, event) {
  event.stopPropagation();
  receipts = receipts.filter(r => r.id !== id);
  saveReceipts();
  renderHistoryList();
  showToast("🗑️ 发票存档已删除");
}
function downloadReceiptFromPaper(paperEl, filename) {
  if (typeof html2canvas === "undefined") {
    showToast("⏳ 正在加载导出组件，请稍后再点一次...", "warn");
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
    script.onload = () => { showToast("✅ 加载完成，请再次点击下载", "ok"); };
    document.head.appendChild(script);
    return;
  }
  showToast("🖨️ 正在生成图片...", "");
  html2canvas(paperEl, { backgroundColor: "#FAF6EE", scale: 2, useCORS: true, logging: false })
    .then(canvas => {
      const link = document.createElement("a");
      link.download = (filename || "结算小票") + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      showToast("✅ 小票图片已下载！", "ok");
    }).catch(() => { showToast("❌ 导出失败，请重试", "err"); });
}

// ============ 重置 ============
function showResetDialog() { resetOverlay.classList.add("show"); }
function hideResetDialog() { resetOverlay.classList.remove("show"); }
function doReset() {
  totalPoints = 0; dailyDeducted = 0; dailyDate = getTodayStr();
  customTasks = []; receipts = []; deletedPresets = [];
  goals = []; editingGoalId = null; editingTaskId = null; bookmarkedExchange = [];
  exchangeFormOpen = false; editingExchangeId = null;
  categories = DEFAULT_CATEGORIES.map(c => ({...c}));
  activeCategory = 'cat_all';
  pointsDisplay.textContent = 0;
  logList.innerHTML = '<li class="empty">暂无记录，快去完成第一个任务吧 ✨</li>';
  try {
    ["my_points_total","my_points_log_html","my_points_daily_date",
     "my_points_daily_deducted","my_points_custom_tasks","my_points_receipts",
     "my_points_deleted_presets","my_points_categories",
     "my_points_goal_name","my_points_goal_target","my_points_goals",
     "my_points_bookmarked_exchange"].forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  hideResetDialog();
  updateDailyBar();
  renderGoalList();
  updateDashboardSummary();
  renderCategoryTabs();
  renderTaskCards('cat_all');
  renderAllExchangeItems();
  // 重置兑换表单 UI
  document.getElementById("exchangeFormWrap").classList.remove("open");
  document.getElementById("btnNewExchange").textContent = "＋ 添加兑换商品";
  cancelExchangeEdit();
  renderHistoryList();
  updateRestoreButton();
  refreshExchangeButtons();
  refreshSpendButtons();
  saveCategories();
  saveStateToCloud(); // 立即同步云端（重置后云端也是空数据）
  showToast("🔄 数据已全部重置");
}

// ============ 持久化 ============
function saveAll() { savePoints(); saveDailyData(); saveCustomTasks(); saveDeletedPresets(); scheduleCloudSave(); }
function savePoints() {
  try { localStorage.setItem("my_points_total", totalPoints); localStorage.setItem("my_points_log_html", logList.innerHTML); } catch (e) {}
  scheduleCloudSave();
}
function saveCustomTasks() {
  try { localStorage.setItem("my_points_custom_tasks", JSON.stringify(customTasks)); } catch (e) {}
  scheduleCloudSave();
}

function loadAll() {
  try {
    const s = localStorage.getItem("my_points_total");
    if (s !== null) { totalPoints = parseInt(s, 10) || 0; pointsDisplay.textContent = totalPoints; }
    const lh = localStorage.getItem("my_points_log_html");
    if (lh && !lh.includes("暂无记录")) logList.innerHTML = lh;
  } catch (e) {}
  loadDailyData();
  updateDailyBar();
  // 加载自定义任务
  try {
    const raw = localStorage.getItem("my_points_custom_tasks");
    if (raw) {
      customTasks = JSON.parse(raw);
      // 旧数据兼容: 没有 categoryId 的默认 cat_all
      customTasks.forEach(t => { if (!t.categoryId) t.categoryId = 'cat_all'; });
    }
  } catch (e) {}
  loadReceipts();
  loadDeletedPresets();
  loadGoals();
  loadBookmarks();
  initCategories();

  // 渲染所有 UI
  renderCategoryTabs();
  renderCategorySelect();
  renderTaskCards(activeCategory);
  renderAllExchangeItems();
  renderHistoryList();
  updateRestoreButton();
  updateDashboardSummary();
  renderGoalList();
  refreshExchangeButtons();
  refreshSpendButtons();
  updateSegSlider(currentView);
}

// ============ 启动 ============
// 恢复上次视图
try {
  const saved = sessionStorage.getItem("my_points_current_view");
  if (saved && ['dashboard','tasks','ledger'].includes(saved)) {
    currentView = saved;
    document.querySelectorAll('.view-panel').forEach(p => {
      p.classList.remove('active');
      p.style.opacity = '0';
      p.style.display = 'none';
    });
    const target = document.getElementById('view-' + currentView);
    if (target) {
      target.style.display = '';
      target.classList.add('active');
      target.style.opacity = '1';
    }
    document.querySelectorAll('.segment').forEach(seg => {
      seg.classList.toggle('active', seg.dataset.view === currentView);
    });
  }
} catch(e) {}

loadAll();
updateSegSlider(currentView);

// ===== 🔗 启动后尝试从云端恢复数据（异步，不阻塞页面） =====
(async function initCloudSync() {
  await loadStateFromCloud();   // 云端有数据 → 覆盖本地 → 保存到 localStorage

  // 云端恢复后，刷新所有 UI（让云端的积分/任务/愿望等显示出来）
  pointsDisplay.textContent = totalPoints;
  updateDailyBar();
  renderCategoryTabs();
  renderCategorySelect();
  renderTaskCards(activeCategory);
  renderAllExchangeItems();
  renderHistoryList();
  updateRestoreButton();
  updateDashboardSummary();
  renderGoalList();
  refreshExchangeButtons();
  refreshSpendButtons();
  updateSegSlider(currentView);
})();

setInterval(() => {
  const today = getTodayStr();
  if (dailyDate !== today) {
    checkNewDay();
    refreshSpendButtons();
    refreshExchangeButtons();
    updateDailyBar();
    updateDashboardSummary();
    updateGoalBars();
  }
}, 60000);
</script>
